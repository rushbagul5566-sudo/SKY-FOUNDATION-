<!DOCTYPE html>
<html lang="mr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sky Foundation | आरोग्य, संघटन, सहकार्य</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;500;600;700;800&family=Poppins:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --sky-deep:#0B4A7C;
    --sky-mid:#1477B8;
    --sky-light:#3FA9E0;
    --gold:#E3A83B;
    --gold-deep:#C9871F;
    --gold-soft:#F3D9A4;
    --ink:#0C2233;
    --ink-soft:#4A5D6B;
    --paper:#F6F9FC;
    --paper-deep:#EBF2F8;
    --white:#FFFFFF;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{scroll-behavior:smooth;}
  body{
    font-family:'Inter','Noto Sans Devanagari',sans-serif;
    background:var(--paper);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }
  .marathi{ font-family:'Noto Sans Devanagari','Inter',sans-serif; }
  img{ max-width:100%; display:block; }
  .container{ max-width:1180px; margin:0 auto; padding:0 clamp(18px,5vw,40px); }
  a{ text-decoration:none; color:inherit; }

  /* laurel signature motif */
  .laurel-divider{
    display:flex; align-items:center; justify-content:center; gap:14px;
    margin:0 auto 18px; width:fit-content;
  }
  .laurel-divider svg{ width:26px; height:26px; opacity:.8; }
  .laurel-divider .line{ width:36px; height:2px; background:linear-gradient(90deg, transparent, var(--gold), transparent); }

  .eyebrow-label{
    display:inline-block; color:var(--gold-deep); font-weight:700;
    letter-spacing:1.6px; font-size:12.5px; text-transform:uppercase;
    margin-bottom:10px;
  }

  /* ---------- NAVBAR ---------- */
  .navbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:14px clamp(16px,4vw,40px);
    background:rgba(255,255,255,0.96);
    backdrop-filter:blur(8px);
    position:sticky; top:0; z-index:100;
    box-shadow:0 1px 0 rgba(12,34,51,0.06);
  }
  .brand{ display:flex; align-items:center; gap:12px; }
  .logo-ring{
    width:48px; height:48px; border-radius:50%;
    background:conic-gradient(from 200deg, var(--gold), var(--sky-mid), var(--gold));
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 4px 10px rgba(20,119,184,0.25);
    flex-shrink:0;
  }
  .logo-ring span{
    width:40px; height:40px; border-radius:50%; background:var(--white);
    display:flex; align-items:center; justify-content:center;
    font-weight:800; color:var(--sky-mid); font-size:17px; font-family:'Poppins',sans-serif;
  }
  .brand-text h1{
    font-family:'Poppins',sans-serif; font-size:clamp(17px,4vw,22px);
    font-weight:700; color:var(--sky-deep); line-height:1.1;
  }
  .brand-text p{
    font-size:clamp(10.5px,2.6vw,12.5px); color:var(--sky-mid); font-weight:600;
    letter-spacing:.3px;
  }
  .nav-links{
    display:flex; gap:28px; list-style:none;
  }
  .nav-links a{
    font-weight:600; font-size:14.5px; color:var(--ink-soft);
    transition:color .2s;
  }
  .nav-links a:hover{ color:var(--sky-mid); }
  .nav-actions{ display:flex; align-items:center; gap:14px; }
  .btn-donate-nav{
    font-family:'Poppins',sans-serif;
    background:linear-gradient(135deg, var(--sky-mid), var(--sky-deep));
    color:#fff; border:none; padding:10px 20px; border-radius:999px;
    font-weight:600; font-size:clamp(12px,3vw,14px); cursor:pointer;
    white-space:nowrap;
    box-shadow:0 6px 14px rgba(11,74,124,0.28);
  }
  .hamburger{
    width:22px; display:none; flex-direction:column; gap:5px; cursor:pointer;
  }
  .hamburger span{ height:2px; background:var(--sky-deep); border-radius:2px; }
  @media (max-width:880px){
    .nav-links{ display:none; }
    .hamburger{ display:flex; }
  }

  /* ---------- HERO ---------- */
  .hero{
    position:relative;
    min-height:94vh;
    display:flex; align-items:flex-end;
    overflow:hidden;
    background:
      linear-gradient(180deg, rgba(9,32,49,0.35) 0%, rgba(9,32,49,0.55) 45%, rgba(6,20,32,0.94) 100%),
      url('images/about.jpg') center/cover no-repeat;
  }
  .hero-inner{
    position:relative; z-index:2;
    padding:clamp(28px,6vw,64px) clamp(18px,6vw,64px) clamp(40px,6vw,80px);
    width:100%;
  }
  .eyebrow{
    display:inline-flex; align-items:center; gap:8px;
    background:rgba(255,255,255,0.12);
    border:1px solid rgba(255,255,255,0.28);
    backdrop-filter:blur(6px);
    color:#fff; padding:8px 16px; border-radius:999px;
    font-size:13px; font-weight:600; letter-spacing:.3px;
    margin-bottom:20px;
  }
  .eyebrow .dot{ width:7px; height:7px; border-radius:50%; background:var(--gold); }
  h2.headline{
    font-family:'Poppins','Noto Sans Devanagari',sans-serif;
    color:#fff; font-weight:800;
    font-size:clamp(34px,7vw,58px);
    line-height:1.12; max-width:780px; margin-bottom:18px;
  }
  h2.headline .accent{ color:var(--gold); }
  .sub{
    color:rgba(255,255,255,0.88); font-size:clamp(15px,3.4vw,18px);
    max-width:620px; line-height:1.65; margin-bottom:30px;
  }
  .hero-ctas{ display:flex; gap:14px; flex-wrap:wrap; margin-bottom:44px; }
  .btn-primary{
    font-family:'Poppins',sans-serif;
    background:linear-gradient(135deg, var(--gold), var(--gold-deep));
    color:#241304; border:none; padding:16px 30px; border-radius:12px;
    font-weight:700; font-size:15px; cursor:pointer;
    box-shadow:0 10px 24px rgba(227,168,59,0.35);
    transition:transform .2s ease, box-shadow .2s ease;
  }
  .btn-primary:hover{ transform:translateY(-2px); box-shadow:0 14px 30px rgba(227,168,59,0.45); }
  .btn-outline{
    font-family:'Poppins',sans-serif;
    background:rgba(255,255,255,0.06); color:#fff; padding:16px 30px; border-radius:12px;
    font-weight:600; font-size:15px; cursor:pointer;
    border:1.5px solid rgba(255,255,255,0.5); backdrop-filter:blur(4px);
    transition:background .2s ease, border-color .2s ease;
  }
  .btn-outline:hover{ background:rgba(255,255,255,0.16); border-color:#fff; }
  .stats{ display:grid; grid-template-columns:repeat(3,1fr); gap:16px; max-width:760px; }
  .stat-card{
    background:rgba(255,255,255,0.10); border:1px solid rgba(255,255,255,0.22);
    backdrop-filter:blur(10px); border-radius:16px; padding:20px 12px; text-align:center;
    transition:transform .25s ease, background .25s ease;
  }
  .stat-card:hover{ transform:translateY(-4px); background:rgba(255,255,255,0.16); }
  .stat-icon{ font-size:22px; margin-bottom:6px; }
  .stat-num{ font-family:'Poppins',sans-serif; font-weight:800; font-size:clamp(24px,5vw,34px); color:var(--gold); line-height:1; }
  .stat-label{ color:rgba(255,255,255,0.85); font-size:clamp(11px,2.6vw,13px); margin-top:6px; font-weight:500; }
  @media (max-width:480px){ .stats{ gap:10px; } .stat-card{ padding:14px 6px; border-radius:12px; } }

  /* ---------- IMPACT BAND ---------- */
  .impact-band{
    background:linear-gradient(135deg, var(--sky-deep), var(--sky-mid));
    padding:56px clamp(18px,5vw,40px);
  }
  .impact-grid{
    max-width:1100px; margin:0 auto;
    display:grid; grid-template-columns:repeat(4,1fr); gap:24px;
    text-align:center;
  }
  .impact-item h3{
    font-family:'Poppins',sans-serif; font-size:clamp(28px,5vw,40px); font-weight:800;
    color:var(--gold-soft);
  }
  .impact-item p{ color:rgba(255,255,255,0.85); font-size:14px; font-weight:500; margin-top:4px; }
  @media (max-width:700px){ .impact-grid{ grid-template-columns:repeat(2,1fr); row-gap:34px; } }

  /* ---------- SECTION GENERIC ---------- */
  section{ padding:clamp(56px,9vw,96px) 0; }
  .section-head{ text-align:center; max-width:640px; margin:0 auto 48px; }
  .section-head h2{
    font-family:'Poppins','Noto Sans Devanagari',sans-serif;
    font-size:clamp(26px,5vw,38px); font-weight:800; color:var(--sky-deep); line-height:1.25;
  }
  .section-head p{ color:var(--ink-soft); margin-top:12px; font-size:15.5px; line-height:1.6; }

  /* ---------- ABOUT ---------- */
  .about-wrap{ display:grid; grid-template-columns:1fr 1fr; gap:56px; align-items:center; }
  .about-img{ position:relative; }
  .about-img img{
    border-radius:20px; box-shadow:0 24px 48px rgba(11,74,124,0.18);
    aspect-ratio:4/5; object-fit:cover; width:100%;
  }
  .about-img::before{
    content:""; position:absolute; top:-18px; left:-18px; width:90px; height:90px;
    border:3px solid var(--gold); border-radius:20px; z-index:-1;
  }
  .about-copy h2{
    font-family:'Poppins','Noto Sans Devanagari',sans-serif;
    font-size:clamp(26px,4.6vw,36px); font-weight:800; color:var(--sky-deep);
    line-height:1.3; margin-bottom:18px;
  }
  .about-copy p{ color:var(--ink-soft); line-height:1.75; font-size:15.5px; margin-bottom:14px; }
  .focus-list{ list-style:none; margin:22px 0 28px; display:grid; gap:12px; }
  .focus-list li{ display:flex; align-items:center; gap:12px; font-weight:600; font-size:14.5px; color:var(--ink); }
  .focus-list li svg{ width:20px; height:20px; flex-shrink:0; color:var(--gold-deep); }
  @media (max-width:860px){ .about-wrap{ grid-template-columns:1fr; } .about-img::before{ display:none; } }

  /* ---------- MISSION / VISION / VALUES ---------- */
  .mv-section{ background:var(--paper-deep); }
  .mv-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:26px; }
  .mv-card{
    background:var(--white); border-radius:18px; padding:32px 26px;
    box-shadow:0 10px 30px rgba(11,74,124,0.08);
    border-top:4px solid var(--gold);
    transition:transform .25s ease;
  }
  .mv-card:hover{ transform:translateY(-6px); }
  .mv-card h3{ font-family:'Poppins',sans-serif; color:var(--sky-deep); font-size:19px; font-weight:700; margin-bottom:12px; }
  .mv-card p{ color:var(--ink-soft); font-size:14.5px; line-height:1.7; }
  @media (max-width:860px){ .mv-grid{ grid-template-columns:1fr; } }

  /* ---------- PROGRAMS ---------- */
  .prog-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:26px; }
  .prog-card{
    background:var(--white); border-radius:20px; overflow:hidden;
    box-shadow:0 14px 34px rgba(11,74,124,0.10);
    transition:transform .25s ease, box-shadow .25s ease;
  }
  .prog-card:hover{ transform:translateY(-8px); box-shadow:0 22px 46px rgba(11,74,124,0.16); }
  .prog-img{ height:190px; overflow:hidden; }
  .prog-img img{ width:100%; height:100%; object-fit:cover; transition:transform .4s ease; }
  .prog-card:hover .prog-img img{ transform:scale(1.06); }
  .prog-body{ padding:22px 22px 26px; }
  .prog-body h3{ font-family:'Poppins',sans-serif; font-size:18px; font-weight:700; color:var(--sky-deep); margin-bottom:8px; }
  .prog-body p{ color:var(--ink-soft); font-size:14px; line-height:1.6; margin-bottom:14px; }
  .prog-body a{ color:var(--gold-deep); font-weight:700; font-size:14px; }
  @media (max-width:860px){ .prog-grid{ grid-template-columns:1fr; } }

  /* ---------- CTA BAND ---------- */
  .cta-band{
    background:linear-gradient(135deg, var(--gold), var(--gold-deep));
    text-align:center; padding:64px clamp(18px,5vw,40px);
  }
  .cta-band h2{
    font-family:'Poppins','Noto Sans Devanagari',sans-serif;
    color:#2A1904; font-size:clamp(24px,4.6vw,34px); font-weight:800; margin-bottom:14px;
  }
  .cta-band p{ color:#3A2708; max-width:560px; margin:0 auto 28px; font-size:15.5px; line-height:1.65; }
  .btn-dark{
    font-family:'Poppins',sans-serif; background:var(--ink); color:#fff;
    border:none; padding:16px 34px; border-radius:12px; font-weight:700; font-size:15px; cursor:pointer;
    box-shadow:0 12px 26px rgba(12,34,51,0.3);
  }

  /* ---------- GALLERY ---------- */
  .gallery-grid{
    display:grid; grid-template-columns:repeat(5,1fr); gap:14px;
  }
  .gallery-grid img{
    width:100%; height:220px; object-fit:cover; border-radius:14px;
    transition:transform .35s ease, box-shadow .35s ease;
    box-shadow:0 8px 20px rgba(11,74,124,0.10);
  }
  .gallery-grid img:hover{ transform:scale(1.04); box-shadow:0 16px 30px rgba(11,74,124,0.2); }
  @media (max-width:960px){ .gallery-grid{ grid-template-columns:repeat(3,1fr); } .gallery-grid img{ height:160px; } }
  @media (max-width:600px){ .gallery-grid{ grid-template-columns:repeat(2,1fr); } }

  /* ---------- VOLUNTEER ---------- */
  .vol-band{
    background:linear-gradient(135deg, var(--sky-deep), var(--ink));
    color:#fff; text-align:center; padding:64px clamp(18px,5vw,40px);
  }
  .vol-band h2{ font-family:'Poppins',sans-serif; font-size:clamp(24px,4.6vw,34px); font-weight:800; margin-bottom:14px; }
  .vol-band p{ max-width:560px; margin:0 auto 30px; color:rgba(255,255,255,0.85); font-size:15.5px; line-height:1.65; }
  .vol-actions{ display:flex; gap:16px; justify-content:center; flex-wrap:wrap; }
  .btn-whatsapp{
    font-family:'Poppins',sans-serif; background:#25D366; color:#0A2A14;
    border:none; padding:16px 30px; border-radius:12px; font-weight:700; font-size:15px; cursor:pointer;
    box-shadow:0 10px 24px rgba(37,211,102,0.35);
  }

  /* ---------- CONTACT ---------- */
  .contact-wrap{ display:grid; grid-template-columns:1fr 1fr; gap:40px; align-items:stretch; }
  .contact-info{
    background:var(--white); border-radius:20px; padding:34px;
    box-shadow:0 14px 34px rgba(11,74,124,0.10);
  }
  .contact-info h3{ font-family:'Poppins',sans-serif; color:var(--sky-deep); font-size:20px; font-weight:700; margin-bottom:22px; }
  .contact-row{ display:flex; gap:14px; align-items:flex-start; margin-bottom:20px; }
  .contact-row .ic{
    width:40px; height:40px; border-radius:12px; background:var(--paper-deep);
    display:flex; align-items:center; justify-content:center; flex-shrink:0; color:var(--sky-mid);
  }
  .contact-row div p{ color:var(--ink-soft); font-size:14.5px; line-height:1.6; }
  .contact-row div a{ color:var(--sky-mid); font-weight:600; }
  .map-frame{ border-radius:20px; overflow:hidden; box-shadow:0 14px 34px rgba(11,74,124,0.10); min-height:300px; }
  .map-frame iframe{ width:100%; height:100%; min-height:300px; border:none; }
  @media (max-width:860px){ .contact-wrap{ grid-template-columns:1fr; } }

  /* ---------- TEAM ---------- */
  .team-section{ background:var(--paper-deep); }
  .team-grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:22px; }
  .team-card{ background:var(--white); border-radius:18px; padding:26px 18px; text-align:center; box-shadow:0 10px 26px rgba(11,74,124,0.08); transition:transform .25s ease; }
  .team-card:hover{ transform:translateY(-6px); }
  .team-avatar{ width:86px; height:86px; border-radius:50%; margin:0 auto 16px; background:linear-gradient(135deg,var(--sky-light),var(--sky-deep)); display:flex; align-items:center; justify-content:center; color:#fff; font-family:'Poppins',sans-serif; font-weight:700; font-size:26px; border:3px solid var(--gold-soft); }
  .team-card h4{ font-family:'Poppins',sans-serif; font-size:16px; color:var(--sky-deep); font-weight:700; margin-bottom:4px; }
  .team-card p{ color:var(--ink-soft); font-size:13px; font-weight:500; }
  @media (max-width:860px){ .team-grid{ grid-template-columns:repeat(2,1fr); } }

  /* ---------- TESTIMONIALS ---------- */
  .test-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:24px; }
  .test-card{ background:var(--white); border-radius:18px; padding:30px 26px; box-shadow:0 10px 28px rgba(11,74,124,0.08); position:relative; }
  .test-quote{ font-size:34px; color:var(--gold-soft); font-family:Georgia,serif; line-height:0; margin-bottom:10px; display:block; }
  .test-card p.msg{ color:var(--ink-soft); font-size:14.5px; line-height:1.7; margin-bottom:18px; }
  .test-person{ display:flex; align-items:center; gap:12px; }
  .test-avatar{ width:42px; height:42px; border-radius:50%; background:var(--sky-mid); color:#fff; display:flex; align-items:center; justify-content:center; font-weight:700; font-family:'Poppins',sans-serif; font-size:14px; flex-shrink:0; }
  .test-person strong{ display:block; font-size:14px; color:var(--sky-deep); }
  .test-person span{ font-size:12.5px; color:var(--ink-soft); }
  @media (max-width:860px){ .test-grid{ grid-template-columns:1fr; } }

  /* ---------- BLOG / NEWS ---------- */
  .blog-section{ background:var(--paper-deep); }
  .blog-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:26px; }
  .blog-card{ background:var(--white); border-radius:20px; overflow:hidden; box-shadow:0 14px 34px rgba(11,74,124,0.10); transition:transform .25s ease, box-shadow .25s ease; }
  .blog-card:hover{ transform:translateY(-8px); box-shadow:0 22px 46px rgba(11,74,124,0.16); }
  .blog-img{ height:170px; overflow:hidden; }
  .blog-img img{ width:100%; height:100%; object-fit:cover; }
  .blog-body{ padding:20px 22px 24px; }
  .blog-date{ color:var(--gold-deep); font-size:12.5px; font-weight:700; letter-spacing:.4px; text-transform:uppercase; margin-bottom:8px; display:block; }
  .blog-body h3{ font-family:'Poppins',sans-serif; font-size:17px; font-weight:700; color:var(--sky-deep); margin-bottom:8px; line-height:1.4; }
  .blog-body p{ color:var(--ink-soft); font-size:14px; line-height:1.6; margin-bottom:12px; }
  .blog-body a{ color:var(--gold-deep); font-weight:700; font-size:13.5px; }
  @media (max-width:860px){ .blog-grid{ grid-template-columns:1fr; } }

  /* ---------- FAQ ---------- */
  .faq-list{ max-width:760px; margin:0 auto; display:grid; gap:14px; }
  .faq-item{ background:var(--white); border-radius:14px; box-shadow:0 8px 22px rgba(11,74,124,0.07); overflow:hidden; }
  .faq-q{ display:flex; align-items:center; justify-content:space-between; padding:20px 24px; cursor:pointer; font-family:'Poppins',sans-serif; font-weight:600; font-size:15px; color:var(--sky-deep); }
  .faq-q .plus{ font-size:20px; color:var(--gold-deep); transition:transform .25s ease; flex-shrink:0; margin-left:14px; }
  .faq-item.open .faq-q .plus{ transform:rotate(45deg); }
  .faq-a{ max-height:0; overflow:hidden; transition:max-height .3s ease; }
  .faq-a p{ padding:0 24px 20px; color:var(--ink-soft); font-size:14.5px; line-height:1.7; }
  .faq-item.open .faq-a{ max-height:200px; }

  /* ---------- DONATE FORM ---------- */
  .donate-section{ background:linear-gradient(135deg, var(--sky-deep), var(--ink)); }
  .donate-wrap{ max-width:560px; margin:0 auto; background:var(--white); border-radius:22px; padding:38px 32px; box-shadow:0 24px 50px rgba(0,0,0,0.25); }
  .donate-wrap h3{ font-family:'Poppins',sans-serif; color:var(--sky-deep); font-size:21px; font-weight:700; margin-bottom:6px; text-align:center; }
  .donate-wrap > p{ color:var(--ink-soft); font-size:14px; text-align:center; margin-bottom:24px; }
  .amount-row{ display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-bottom:20px; }
  .amount-btn{ font-family:'Poppins',sans-serif; background:var(--paper-deep); border:2px solid transparent; border-radius:10px; padding:12px 6px; font-weight:700; color:var(--sky-deep); cursor:pointer; font-size:14px; }
  .amount-btn.active{ border-color:var(--gold); background:var(--gold-soft); }
  .form-field{ margin-bottom:16px; }
  .form-field label{ display:block; font-size:13px; font-weight:600; color:var(--ink); margin-bottom:6px; }
  .form-field input{ width:100%; padding:13px 14px; border-radius:10px; border:1.5px solid #DCE5EC; font-size:14.5px; font-family:'Inter',sans-serif; }
  .form-field input:focus{ outline:none; border-color:var(--sky-mid); }
  .btn-donate-submit{ width:100%; font-family:'Poppins',sans-serif; background:linear-gradient(135deg, var(--gold), var(--gold-deep)); color:#241304; border:none; padding:16px; border-radius:12px; font-weight:700; font-size:15.5px; cursor:pointer; margin-top:6px; box-shadow:0 10px 24px rgba(227,168,59,0.35); }

  /* ---------- FOOTER ---------- */
